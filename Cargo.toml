[workspace]
resolver = "2"
members = ["crates/p2x-net", "apps/p2x-exchange", "apps/p2x-client", "apps/p2x-server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
libp2p = { version = "=0.56.0", default-features = false, features = ["dcutr", "dns", "ed25519", "identify", "macros", "noise", "ping", "quic", "relay", "tcp", "tokio", "yamux"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "deny"
