[workspace]
resolver = "2"
members = ["crates/p2x-protocol", "crates/p2x-config", "crates/p2x-net", "apps/p2x-exchange", "apps/p2x-client", "apps/p2x-server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
libp2p = { version = "=0.56.0", default-features = false, features = ["dcutr", "dns", "ed25519", "identify", "macros", "noise", "ping", "quic", "relay", "request-response", "tcp", "tokio", "yamux"] }
libc = "0.2"
libp2p-identity = { version = "0.2.14", features = ["ed25519"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "deny"
